<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complaint — Hands Together</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body data-page="complaint"><div id="site-header"></div><main class="form-page section-wrap"><section class="form-page-card"><p class="eyebrow">GET HELP</p><h1>Send a complaint</h1><p class="muted">Our administrators review each complaint privately.</p><form id="complaint-form" class="form-stack"><label>Your name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Subject<input name="subject" required></label><label>What happened?<textarea name="message" rows="5" required></textarea></label><button class="button button-green button-full">Send for review</button></form></section></main><div id="site-footer"></div><div class="toast" role="status"></div></body></html>
