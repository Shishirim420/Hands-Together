<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Donate — Hands Together</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body data-page="donate"><div id="site-header"></div><main class="form-page section-wrap"><section class="form-page-card"><p class="eyebrow">COMMUNITY SUPPORT</p><h1>Make a donation</h1><p class="muted">Your submission is reviewed by an administrator before it is accepted.</p><form id="donation-form" class="form-stack"><label>Your name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Amount (BDT)<input name="amount" type="number" min="1" step="1" required></label><label>Payment method<select name="method" required><option value="">Choose a method</option><option>bKash</option><option>Nagad</option><option>Bank transfer</option><option>Cash collection</option></select></label><label>Note (optional)<textarea name="note" rows="3"></textarea></label><button class="button button-green button-full">Submit for review</button></form></section></main><div id="site-footer"></div><div class="toast" role="status"></div></body></html>
